<!doctype html>
<!--
  Netlify finds forms by parsing static HTML when the site deploys. The signup
  form lives in React, so Netlify would never see it. This file is the static
  declaration it looks for: the field names here must match the inputs in
  src/components/Signup.jsx, and the page itself is never shown to anyone.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Form declaration</title>
  </head>
  <body>
    <form name="early-access" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="year" />
      <input type="text" name="department" />
      <input type="text" name="interests" />
      <textarea name="bio"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
